name: UE5 Project CI

# Trigger on push to main branches and pull requests
on:
  push:
    branches: [ codexia, main ]
  pull_request:
    branches: [ codexia, main ]
  workflow_dispatch:

jobs:
  # Validate project structure and files
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Check for .uproject file
      run: |
        echo "Checking for UE5 project file..."
        if ls *.uproject 1> /dev/null 2>&1; then
          echo "✓ Found UE5 project file"
        else
          echo "⚠️  No .uproject file found yet - this is normal for initial setup"
        fi
    
    - name: Validate directory structure
      run: |
        echo "Validating expected directories..."
        for dir in Content Plugins Source Config Scripts Docs; do
          if [ -d "$dir" ]; then
            echo "✓ $dir directory exists"
          else
            echo "ℹ️  $dir directory will be created when needed"
          fi
        done
    
    - name: Check for README
      run: |
        if [ -f "README.md" ]; then
          echo "✓ README.md found"
        else
          echo "❌ README.md missing"
          exit 1
        fi
  
  # Lint and validate scripts
  lint-scripts:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint Python scripts
      run: |
        if [ -d "Scripts" ]; then
          echo "Linting Python scripts..."
          flake8 Scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        else
          echo "No Scripts directory found - skipping lint"
        fi
  
  # Build documentation
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        echo "Documentation files:"
        find . -name '*.md' -not -path './node_modules/*' | head -20
  
  # Placeholder for future UE5 build job
  # This will require a self-hosted runner with UE5 installed
  build-placeholder:
    name: UE5 Build (Placeholder)
    runs-on: ubuntu-latest
    
    steps:
    - name: Build Notice
      run: |
        echo "═══════════════════════════════════════════════════════"
        echo "  UE5 Build Placeholder"
        echo "═══════════════════════════════════════════════════════"
        echo ""
        echo "To enable UE5 builds:"
        echo "1. Set up a self-hosted runner with Windows + UE5"
        echo "2. Install required build tools (Visual Studio, etc.)"
        echo "3. Update this workflow to use the self-hosted runner"
        echo "4. Add actual build commands (RunUAT, etc.)"
        echo ""
